<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRPG 情報整理・考察ノート（長期テキセ・秘匿対応版）</title>
<style>
  :root {
    --bg-main: #0f1117;
    --bg-panel: #181b24;
    --bg-card: #212531;
    --bg-hover: #2a2f3d;
    --border: #2e3446;
    --text-main: #e2e8f0;
    --text-muted: #94a3b8;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --secret: #a855f7;
    --secret-bg: rgba(168, 85, 247, 0.14);
    --secret-border: rgba(168, 85, 247, 0.45);
    --info-color: #38bdf8;
    --npc-color: #34d399;
    --loc-color: #fbbf24;
    --hyp-color: #f472b6;
    --danger: #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    background-color: var(--bg-main);
    color: var(--text-main);
    line-height: 1.5;
    font-size: 14px;
  }

  /* Header */
  header {
    background-color: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 18px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left, .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .app-title {
    font-weight: 700;
    font-size: 15px;
    color: #fff;
    margin-right: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  select, input[type="text"], textarea {
    background-color: var(--bg-main);
    color: var(--text-main);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    font-family: inherit;
  }
  select:focus, input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    background-color: var(--bg-card);
    color: var(--text-main);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  button:hover { background-color: var(--bg-hover); }
  button.primary {
    background-color: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  button.primary:hover { background-color: var(--accent-hover); }
  button.secret-btn {
    background-color: var(--secret);
    border-color: var(--secret);
    color: #fff;
    font-weight: 600;
  }
  button.secret-btn:hover { background-color: #9333ea; }
  button.danger { color: #fca5a5; border-color: rgba(239,68,68,0.4); }
  button.danger:hover { background-color: rgba(239,68,68,0.2); }

  /* Layout */
  .container {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 16px;
    padding: 16px;
    max-width: 1600px;
    margin: 0 auto;
  }
  @media (max-width: 960px) {
    .container { grid-template-columns: 1fr; }
  }

  .panel {
    background-color: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .panel-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }

  /* Free Memo */
  .free-memo-area {
    width: 100%;
    min-height: 110px;
    resize: vertical;
    line-height: 1.5;
    font-size: 13px;
  }

  /* Todo List */
  .todo-input-row { display: flex; gap: 6px; }
  .todo-input-row input { flex: 1; }
  .todo-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-card);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  .todo-item.done span { text-decoration: line-through; color: var(--text-muted); }
  .todo-item span { flex: 1; word-break: break-word; }

  /* Tabs */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
  }
  .tab-btn {
    padding: 7px 14px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 13px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
  }
  .tab-btn:hover { background: var(--bg-card); color: var(--text-main); }
  .tab-btn.active {
    background: var(--bg-card);
    border-color: var(--accent);
    color: #fff;
  }
  .tab-btn.secret-tab.active {
    background: var(--secret-bg);
    border-color: var(--secret);
    color: #e9d5ff;
  }
  .badge-count {
    background: rgba(255,255,255,0.1);
    padding: 1px 6px;
    border-radius: 10px;
    font-size: 11px;
    margin-left: 4px;
  }

  /* Filter Bar */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    background: var(--bg-card);
    padding: 8px 12px;
    border-radius: 8px;
  }
  .filter-bar input { flex: 1; min-width: 180px; }

  /* Cards */
  .card-list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background-color: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .card.secret-card {
    border-left: 4px solid var(--secret);
    background: linear-gradient(90deg, rgba(168,85,247,0.08) 0%, var(--bg-card) 35%);
  }
  .card.highlight {
    border-color: #fbbf24 !important;
    box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.35);
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 6px;
  }
  .card-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    font-size: 11px;
  }
  .tag {
    padding: 2px 7px;
    border-radius: 4px;
    font-weight: 600;
    background: rgba(255,255,255,0.08);
  }
  .tag.day { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; }
  .tag.secret-tag { background: var(--secret-bg); color: #d8b4fe; border: 1px solid var(--secret-border); }
  .tag.npc-tag { background: rgba(52, 211, 153, 0.15); color: #6ee7b7; }
  .tag.loc-tag { background: rgba(251, 191, 36, 0.15); color: #fcd34d; }
  .tag.hyp-tag { background: rgba(244, 114, 182, 0.15); color: #f9a8d4; }

  .card-title { font-weight: 700; font-size: 15px; color: #fff; margin-bottom: 4px; }
  .card-summary { color: var(--text-main); font-size: 13.5px; white-space: pre-wrap; }

  details.raw-log {
    margin-top: 8px;
    background: var(--bg-main);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
  }
  details.raw-log summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--text-muted);
    user-select: none;
  }
  details.raw-log pre {
    margin-top: 6px;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: inherit;
    font-size: 12.5px;
    color: #cbd5e1;
    border-top: 1px dashed var(--border);
    padding-top: 6px;
  }

  /* Links */
  .links-area {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .link-chip {
    font-size: 11.5px;
    padding: 3px 8px;
    border-radius: 12px;
    background: rgba(99, 102, 241, 0.15);
    border: 1px solid rgba(99, 102, 241, 0.4);
    color: #c7d2fe;
    cursor: pointer;
    transition: background 0.15s;
  }
  .link-chip:hover { background: rgba(99, 102, 241, 0.3); }
  .link-chip.secret { background: var(--secret-bg); border-color: var(--secret-border); color: #e9d5ff; }
  .link-chip.npc { background: rgba(52,211,153,0.12); border-color: rgba(52,211,153,0.4); color: #a7f3d0; }
  .link-chip.loc { background: rgba(251,191,36,0.12); border-color: rgba(251,191,36,0.4); color: #fde68a; }
  .link-chip.hyp { background: rgba(244,114,182,0.12); border-color: rgba(244,114,182,0.4); color: #fbcfe8; }

  /* Modal */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 100%;
    max-width: 640px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .inline-row { display: flex; gap: 8px; align-items: center; }
  .link-selector-box {
    max-height: 160px;
    overflow-y: auto;
    background: var(--bg-main);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .link-option {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .link-option:hover { background: var(--bg-card); }

  /* Timeline View */
  .timeline-group {
    border-left: 2px solid var(--accent);
    padding-left: 14px;
    margin-bottom: 18px;
  }
  .timeline-day-title {
    font-size: 14px;
    font-weight: 700;
    color: #93c5fd;
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="app-title">🎲 TRPG 情報精査ノート</span>
    <select id="scenarioSelect" onchange="switchScenario(this.value)"></select>
    <button class="primary" onclick="createNewScenario()">＋ 新規卓</button>
    <button onclick="renameScenario()">卓名変更</button>
    <button class="danger" onclick="deleteScenario()">卓削除</button>
  </div>
  <div class="header-right">
    <button onclick="exportJSON()">💾 保存(JSON)</button>
    <button onclick="document.getElementById('importFile').click()">📂 復元(JSON)</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
    <button onclick="exportMarkdown()">📝 MD出力</button>
  </div>
</header>

<div class="container">
  <!-- Left Sidebar: TODO, Free Memo & Hypotheses -->
  <aside class="panel">
    <div>
      <div class="panel-title">
        <span>📌 現在の目的・未解決TODO</span>
      </div>
      <div class="todo-input-row" style="margin-top:8px;">
        <input type="text" id="newTodoInput" placeholder="例：書斎の金庫の暗証番号を探す" onkeydown="if(event.key==='Enter') addTodo()">
        <button class="primary" onclick="addTodo()">追加</button>
      </div>
      <ul class="todo-list" id="todoList" style="margin-top:8px;"></ul>
    </div>

    <div>
      <div class="panel-title">
        <span>✏️ 自由メモ・PC状況・雑記</span>
        <span style="font-size:11px;font-weight:400;">自動保存</span>
      </div>
      <textarea id="freeMemoInput" class="free-memo-area" style="margin-top:8px;" placeholder="SAN値・HP・MPの変動、他PCの挙動、セッション中のちょっとした気づきなどを自由に書き込めます" oninput="saveFreeMemo()"></textarea>
    </div>

    <div>
      <div class="panel-title">
        <span>🧠 考察・仮説スレッド</span>
        <button class="primary" style="padding:3px 8px;" onclick="openModal('hyp')">＋ 仮説</button>
      </div>
      <div class="card-list" id="hypList" style="margin-top:8px;"></div>
    </div>
  </aside>

  <!-- Right Main Area -->
  <main class="panel">
    <div class="tabs">
      <button class="tab-btn active" data-tab="info" onclick="switchTab('info')">📄 入手情報<span class="badge-count" id="count-info">0</span></button>
      <button class="tab-btn secret-tab" data-tab="secret" onclick="switchTab('secret')">🔒 秘匿HO<span class="badge-count" id="count-secret">0</span></button>
      <button class="tab-btn" data-tab="npc" onclick="switchTab('npc')">👤 NPCリスト<span class="badge-count" id="count-npc">0</span></button>
      <button class="tab-btn" data-tab="loc" onclick="switchTab('loc')">🗺️ 場所・ギミック<span class="badge-count" id="count-loc">0</span></button>
      <button class="tab-btn" data-tab="tree" onclick="switchTab('tree')">🔗 関連ツリー・日程別</button>
    </div>

    <div class="filter-bar" id="filterBar">
      <input type="text" id="searchInput" placeholder="キーワード検索（要約・原文・メモ）..." oninput="renderMain()">
      <select id="dayFilter" onchange="renderMain()">
        <option value="ALL">すべての期間・日程</option>
      </select>
      <button class="primary" id="addPrimaryBtn" onclick="openCurrentTabModal()">＋ 新規記録</button>
    </div>

    <div id="mainContent" class="card-list"></div>
  </main>
</div>

<!-- Modal Form -->
<div class="modal-backdrop" id="editModal">
  <div class="modal">
    <div class="panel-title">
      <span id="modalTitle">新規記録</span>
      <button onclick="closeModal()">✕ 閉じる</button>
    </div>
    <input type="hidden" id="editType">
    <input type="hidden" id="editId">

    <div class="form-group" id="groupDay">
      <label>取得・登録日程</label>
      <div class="inline-row">
        <select id="fieldDay" style="flex:1;"></select>
        <button type="button" onclick="addCustomDay()">＋ 日程を追加</button>
      </div>
    </div>

    <div class="form-group" id="groupSubTag" style="display:none;">
      <label id="labelSubTag">分類タグ</label>
      <select id="fieldSubTag"></select>
    </div>

    <div class="form-group">
      <label id="labelTitle">タイトル / 名前</label>
      <input type="text" id="fieldTitle" placeholder="例：古びた日記の切れ端">
    </div>

    <div class="form-group">
      <label id="labelSummary">1行要約・要点メモ</label>
      <textarea id="fieldSummary" rows="3" placeholder="自分の言葉で噛み砕いた要点"></textarea>
    </div>

    <div class="form-group" id="groupRaw">
      <label>原文・セッションログ（折りたたみ格納用）</label>
      <textarea id="fieldRaw" rows="4" placeholder="ココフォリア等の描写やハンドアウトの原文をそのまま貼り付け"></textarea>
    </div>

    <div class="form-group">
      <label>🔗 過去の情報・秘匿・NPC・場所・仮説と結びつける（双方向リンク）</label>
      <div class="link-selector-box" id="linkSelectorBox"></div>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:6px;">
      <button onclick="closeModal()">キャンセル</button>
      <button class="primary" onclick="saveItem()">保存する</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'trpg_long_text_organizer_v4';

const DEFAULT_DAYS = ['事前・導入', '1日目', '2日目', '3日目', '4日目', '5日目'];

let state = {
  currentScenarioId: null,
  scenarios: {}
};

let currentTab = 'info';

function createDefaultScenarioData(name) {
  return {
    id: 'sc_' + Date.now(),
    name: name,
    days: [...DEFAULT_DAYS],
    freeMemo: '',
    todos: [],
    items: []
  };
}

function createSampleScenario() {
  const sc = createDefaultScenarioData('【サンプル】霧の洋館殺人事件');
  sc.freeMemo = '・探索者は全員、館の主人の招待状を受け取って集まった。\n・23:50頃に1階で物音がしたという証言あり。';
  sc.todos = [
    { id: 't1', text: '地下室の鍵の在り処を執事に聞く', done: false },
    { id: 't2', text: '被害者のダイイングメッセージの意味を解読する', done: false }
  ];
  sc.items = [
    {
      id: 'sec_1',
      type: 'secret',
      num: 1,
      day: '事前・導入',
      subTag: '自PCの秘匿HO',
      title: 'HO1：あなたは館の主人の隠し子である',
      summary: 'あなたは遺産相続権を持つが、他のPCには血縁関係を隠している。深夜0時に書斎へ来るよう手紙を受け取った。',
      raw: '【秘匿ハンドアウト HO1】\nあなたは当主・九条厳一郎の認知されていない実子である。他の探索者には単なる友人として同行していることになっている。',
      links: ['inf_1']
    },
    {
      id: 'inf_1',
      type: 'info',
      num: 1,
      day: '1日目',
      subTag: '公開情報',
      title: '書斎の暖炉から見つかった燃え残りの手紙',
      summary: '「深夜0時、秘密の継承について話す」と書かれた手紙の切れ端。差出人の印章が押されている。',
      raw: 'KP描写：灰の中から半分焦げた羊皮紙が見つかる。『今宵、深夜0時に書斎へ来られよ。真の継承者へすべてを託す――厳一郎』',
      links: ['sec_1', 'npc_1']
    },
    {
      id: 'npc_1',
      type: 'npc',
      num: 1,
      day: '1日目',
      subTag: '重要人物',
      title: '佐伯 宗介（執事・58歳）',
      summary: '長年当主に仕える執事。0時前後のアリバイが曖昧で、書斎の合鍵を持っている可能性がある。',
      raw: '立ち絵：黒服の老紳士。右手に白い手袋をしている。口調は丁寧だが主人の過去については口を閉ざす。',
      links: ['inf_1']
    },
    {
      id: 'loc_1',
      type: 'loc',
      num: 1,
      day: '1日目',
      subTag: '要再調査・ロック中',
      title: '1階・書斎の隠し扉',
      summary: '本棚の裏に鍵穴付きの金属扉がある。〈目星〉成功で発見。',
      raw: '重い鉄製の扉。一般的な鍵ではなく、特殊な紋章型の鍵が必要そうだ。',
      links: ['inf_1']
    },
    {
      id: 'hyp_1',
      type: 'hyp',
      num: 1,
      day: '1日目',
      subTag: '考察仮説',
      title: '当主はHO1を呼び出した直後に殺害された？',
      summary: '手紙の呼び出し時刻と死亡推定時刻が一致。犯人は継承を阻止したかった人物（執事または他PCの秘匿？）の可能性。',
      raw: '',
      links: ['sec_1', 'inf_1', 'npc_1']
    }
  ];
  return sc;
}

function loadState() {
  const saved = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('trpg_long_text_organizer_v3');
  if (saved) {
    try {
      state = JSON.parse(saved);
    } catch (e) {
      console.error(e);
    }
  }
  if (!state.scenarios || Object.keys(state.scenarios).length === 0) {
    const sample = createSampleScenario();
    state.scenarios = { [sample.id]: sample };
    state.currentScenarioId = sample.id;
    saveState();
  }
  if (!state.scenarios[state.currentScenarioId]) {
    state.currentScenarioId = Object.keys(state.scenarios)[0];
  }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function getCurrentScenario() {
  const sc = state.scenarios[state.currentScenarioId];
  if (!sc.days) sc.days = [...DEFAULT_DAYS];
  if (typeof sc.freeMemo !== 'string') sc.freeMemo = '';
  return sc;
}

// Scenario management
function renderScenarioSelect() {
  const select = document.getElementById('scenarioSelect');
  select.innerHTML = '';
  Object.values(state.scenarios).forEach(sc => {
    const opt = document.createElement('option');
    opt.value = sc.id;
    opt.textContent = sc.name;
    if (sc.id === state.currentScenarioId) opt.selected = true;
    select.appendChild(opt);
  });
}

function switchScenario(id) {
  state.currentScenarioId = id;
  saveState();
  renderAll();
}

function createNewScenario() {
  const name = prompt('新しいシナリオ（卓）の名前を入力してください：', '新規シナリオ');
  if (!name || !name.trim()) return;
  const sc = createDefaultScenarioData(name.trim());
  state.scenarios[sc.id] = sc;
  state.currentScenarioId = sc.id;
  saveState();
  renderAll();
}

function renameScenario() {
  const sc = getCurrentScenario();
  const name = prompt('シナリオ名を変更：', sc.name);
  if (!name || !name.trim()) return;
  sc.name = name.trim();
  saveState();
  renderScenarioSelect();
}

function deleteScenario() {
  const keys = Object.keys(state.scenarios);
  if (keys.length <= 1) {
    alert('最後の1つのシナリオは削除できません。');
    return;
  }
  const sc = getCurrentScenario();
  if (!confirm(`「${sc.name}」を削除しますか？この操作は取り消せません。`)) return;
  delete state.scenarios[sc.id];
  state.currentScenarioId = Object.keys(state.scenarios)[0];
  saveState();
  renderAll();
}

// Free Memo
function renderFreeMemo() {
  const sc = getCurrentScenario();
  document.getElementById('freeMemoInput').value = sc.freeMemo || '';
}

function saveFreeMemo() {
  const sc = getCurrentScenario();
  sc.freeMemo = document.getElementById('freeMemoInput').value;
  saveState();
}

// Todos
function addTodo() {
  const input = document.getElementById('newTodoInput');
  const text = input.value.trim();
  if (!text) return;
  const sc = getCurrentScenario();
  sc.todos.push({ id: 't_' + Date.now(), text, done: false });
  input.value = '';
  saveState();
  renderTodos();
}

function toggleTodo(id) {
  const sc = getCurrentScenario();
  const t = sc.todos.find(x => x.id === id);
  if (t) t.done = !t.done;
  saveState();
  renderTodos();
}

function deleteTodo(id) {
  const sc = getCurrentScenario();
  sc.todos = sc.todos.filter(x => x.id !== id);
  saveState();
  renderTodos();
}

function renderTodos() {
  const sc = getCurrentScenario();
  const list = document.getElementById('todoList');
  list.innerHTML = '';
  sc.todos.forEach(t => {
    const li = document.createElement('li');
    li.className = 'todo-item' + (t.done ? ' done' : '');
    li.innerHTML = `
      <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTodo('${t.id}')">
      <span>${escapeHtml(t.text)}</span>
      <button style="padding:2px 6px;" onclick="deleteTodo('${t.id}')">✕</button>
    `;
    list.appendChild(li);
  });
}

// Tabs & Filters
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  const addBtn = document.getElementById('addPrimaryBtn');
  if (tab === 'tree') {
    addBtn.style.display = 'none';
  } else {
    addBtn.style.display = 'inline-flex';
    const labels = {
      info: '＋ 入手情報を記録',
      secret: '＋ 秘匿HOを記録',
      npc: '＋ NPCを登録',
      loc: '＋ 場所を登録'
    };
    addBtn.textContent = labels[tab] || '＋ 新規記録';
    addBtn.className = tab === 'secret' ? 'secret-btn' : 'primary';
  }
  renderMain();
}

function openCurrentTabModal() {
  if (currentTab !== 'tree') openModal(currentTab);
}

function updateDayFilterOptions() {
  const sc = getCurrentScenario();
  const filter = document.getElementById('dayFilter');
  const currentVal = filter.value;
  filter.innerHTML = '<option value="ALL">すべての期間・日程</option>';
  sc.days.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d;
    opt.textContent = d;
    filter.appendChild(opt);
  });
  if ([...filter.options].some(o => o.value === currentVal)) {
    filter.value = currentVal;
  }
}

function getTypeLabel(item) {
  const map = {
    info: `情報#${item.num}`,
    secret: `秘匿#${item.num}`,
    npc: `NPC#${item.num}`,
    loc: `場所#${item.num}`,
    hyp: `仮説#${item.num}`
  };
  return map[item.type] || item.type;
}

// Rendering Cards
function renderCard(item) {
  const sc = getCurrentScenario();
  const card = document.createElement('div');
  card.className = 'card' + (item.type === 'secret' ? ' secret-card' : '');
  card.id = 'card_' + item.id;

  let tagHtml = `<span class="tag day">${escapeHtml(item.day || '日程未設定')}</span>`;
  if (item.type === 'secret') {
    tagHtml += `<span class="tag secret-tag">🔒 ${escapeHtml(item.subTag || '秘匿')}</span>`;
  } else if (item.type === 'npc') {
    tagHtml += `<span class="tag npc-tag">👤 NPC</span>`;
  } else if (item.type === 'loc') {
    tagHtml += `<span class="tag loc-tag">🗺️ ${escapeHtml(item.subTag || '場所')}</span>`;
  } else if (item.type === 'hyp') {
    tagHtml += `<span class="tag hyp-tag">🧠 仮説</span>`;
  }

  // Bidirectional links
  const linkedIds = new Set(item.links || []);
  sc.items.forEach(other => {
    if (other.id !== item.id && (other.links || []).includes(item.id)) {
      linkedIds.add(other.id);
    }
  });

  let linksHtml = '';
  if (linkedIds.size > 0) {
    const chips = [];
    linkedIds.forEach(lid => {
      const target = sc.items.find(x => x.id === lid);
      if (target) {
        chips.push(`<span class="link-chip ${target.type}" onclick="jumpToItem('${target.id}')">[${getTypeLabel(target)}] ${escapeHtml(target.title)}</span>`);
      }
    });
    if (chips.length > 0) {
      linksHtml = `<div class="links-area"><span style="font-size:11px;color:var(--text-muted);">🔗 関連:</span>${chips.join('')}</div>`;
    }
  }

  const rawHtml = item.raw && item.raw.trim()
    ? `<details class="raw-log"><summary>📜 原文・セッションログを表示</summary><pre>${escapeHtml(item.raw)}</pre></details>`
    : '';

  card.innerHTML = `
    <div class="card-header">
      <div class="card-meta">
        <span class="tag">${getTypeLabel(item)}</span>
        ${tagHtml}
      </div>
      <div style="display:flex; gap:4px;">
        <button style="padding:2px 7px;" onclick="openModal('${item.type}', '${item.id}')">編集</button>
        <button class="danger" style="padding:2px 7px;" onclick="deleteItem('${item.id}')">削除</button>
      </div>
    </div>
    <div class="card-title">${escapeHtml(item.title)}</div>
    <div class="card-summary">${escapeHtml(item.summary)}</div>
    ${rawHtml}
    ${linksHtml}
  `;
  return card;
}

function renderHypotheses() {
  const sc = getCurrentScenario();
  const list = document.getElementById('hypList');
  list.innerHTML = '';
  const hyps = sc.items.filter(x => x.type === 'hyp');
  if (hyps.length === 0) {
    list.innerHTML = '<div style="color:var(--text-muted);font-size:12px;">まだ仮説はありません。「＋ 仮説」から手掛かりをまとめた推理を記録できます。</div>';
    return;
  }
  hyps.forEach(h => list.appendChild(renderCard(h)));
}

function updateCounts() {
  const sc = getCurrentScenario();
  ['info', 'secret', 'npc', 'loc'].forEach(t => {
    const el = document.getElementById('count-' + t);
    if (el) el.textContent = sc.items.filter(x => x.type === t).length;
  });
}

function renderMain() {
  const sc = getCurrentScenario();
  const container = document.getElementById('mainContent');
  container.innerHTML = '';
  updateCounts();

  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  const dayFilter = document.getElementById('dayFilter').value;

  const filterFn = (item) => {
    if (dayFilter !== 'ALL' && item.day !== dayFilter) return false;
    if (!keyword) return true;
    const hay = `${item.title} ${item.summary} ${item.raw || ''} ${item.subTag || ''}`.toLowerCase();
    return hay.includes(keyword);
  };

  if (currentTab === 'tree') {
    const dayOrder = [...sc.days];
    sc.items.forEach(it => {
      if (it.day && !dayOrder.includes(it.day)) dayOrder.push(it.day);
    });

    let hasAny = false;
    dayOrder.forEach(day => {
      const dayItems = sc.items.filter(it => it.day === day && filterFn(it));
      if (dayItems.length === 0) return;
      hasAny = true;
      const group = document.createElement('div');
      group.className = 'timeline-group';
      group.innerHTML = `<div class="timeline-day-title">📅 ${escapeHtml(day)}（${dayItems.length}件）</div>`;
      const innerList = document.createElement('div');
      innerList.className = 'card-list';
      dayItems.forEach(it => innerList.appendChild(renderCard(it)));
      group.appendChild(innerList);
      container.appendChild(group);
    });
    if (!hasAny) {
      container.innerHTML = '<div style="color:var(--text-muted);padding:20px;text-align:center;">該当する記録がありません。</div>';
    }
    return;
  }

  const list = sc.items.filter(x => x.type === currentTab && filterFn(x));
  if (list.length === 0) {
    container.innerHTML = '<div style="color:var(--text-muted);padding:20px;text-align:center;">まだ記録がありません。右上のボタンから追加できます。</div>';
    return;
  }
  list.forEach(item => container.appendChild(renderCard(item)));
}

function jumpToItem(id) {
  const sc = getCurrentScenario();
  const target = sc.items.find(x => x.id === id);
  if (!target) return;

  if (target.type !== 'hyp' && currentTab !== target.type && currentTab !== 'tree') {
    document.getElementById('searchInput').value = '';
    document.getElementById('dayFilter').value = 'ALL';
    switchTab(target.type);
  }
  setTimeout(() => {
    const el = document.getElementById('card_' + id);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.add('highlight');
      setTimeout(() => el.classList.remove('highlight'), 1800);
    }
  }, 50);
}

// Modal & Editing
function populateDaySelect(selectedDay) {
  const sc = getCurrentScenario();
  const sel = document.getElementById('fieldDay');
  sel.innerHTML = '';
  sc.days.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d;
    opt.textContent = d;
    sel.appendChild(opt);
  });
  if (selectedDay && !sc.days.includes(selectedDay)) {
    const opt = document.createElement('option');
    opt.value = selectedDay;
    opt.textContent = selectedDay;
    sel.appendChild(opt);
  }
  if (selectedDay) sel.value = selectedDay;
}

function addCustomDay() {
  const newDay = prompt('追加する日程・フェイズ名を入力してください（例：6日目、秘匿HO、エンディング）：');
  if (!newDay || !newDay.trim()) return;
  const trimmed = newDay.trim();
  const sc = getCurrentScenario();
  if (!sc.days.includes(trimmed)) {
    sc.days.push(trimmed);
    saveState();
    updateDayFilterOptions();
  }
  populateDaySelect(trimmed);
}

function openModal(type, id = null) {
  const sc = getCurrentScenario();
  document.getElementById('editType').value = type;
  document.getElementById('editId').value = id || '';

  const titleLabels = {
    info: '入手情報のタイトル',
    secret: '秘匿HO・裏情報のタイトル',
    npc: 'NPCの名前・肩書き',
    loc: '場所・ギミックの名称',
    hyp: '考察・仮説のタイトル'
  };
  const modalHeaders = {
    info: id ? '入手情報の編集' : '新しい入手情報を記録',
    secret: id ? '秘匿HOの編集' : '🔒 新しい秘匿HO・裏情報を記録',
    npc: id ? 'NPC情報の編集' : '新しいNPCを登録',
    loc: id ? '場所情報の編集' : '新しい場所・ギミックを登録',
    hyp: id ? '考察仮説の編集' : '新しい考察・仮説を作成'
  };
  document.getElementById('modalTitle').textContent = modalHeaders[type] || '記録';
  document.getElementById('labelTitle').textContent = titleLabels[type] || 'タイトル';

  // SubTag setup
  const groupSubTag = document.getElementById('groupSubTag');
  const fieldSubTag = document.getElementById('fieldSubTag');
  fieldSubTag.innerHTML = '';
  if (type === 'secret') {
    groupSubTag.style.display = 'flex';
    document.getElementById('labelSubTag').textContent = '秘匿の種別';
    ['自PCの秘匿HO', '秘匿の追加・更新', '他PCへの疑念・推測', '個別導入・裏設定'].forEach(optText => {
      const o = document.createElement('option');
      o.value = optText;
      o.textContent = optText;
      fieldSubTag.appendChild(o);
    });
  } else if (type === 'loc') {
    groupSubTag.style.display = 'flex';
    document.getElementById('labelSubTag').textContent = '探索ステータス';
    ['未探索・未解決', '探索済み・確認完了', '要再調査・ロック中'].forEach(optText => {
      const o = document.createElement('option');
      o.value = optText;
      o.textContent = optText;
      fieldSubTag.appendChild(o);
    });
  } else {
    groupSubTag.style.display = 'none';
  }

  const item = id ? sc.items.find(x => x.id === id) : null;
  populateDaySelect(item ? item.day : (sc.days[1] || sc.days[0]));
  document.getElementById('fieldTitle').value = item ? item.title : '';
  document.getElementById('fieldSummary').value = item ? item.summary : '';
  document.getElementById('fieldRaw').value = item ? (item.raw || '') : '';
  if (item && item.subTag && (type === 'secret' || type === 'loc')) {
    fieldSubTag.value = item.subTag;
  }

  // Link selector
  const box = document.getElementById('linkSelectorBox');
  box.innerHTML = '';
  const currentLinks = new Set(item ? (item.links || []) : []);
  if (item) {
    sc.items.forEach(other => {
      if ((other.links || []).includes(item.id)) currentLinks.add(other.id);
    });
  }

  const candidates = sc.items.filter(x => x.id !== id);
  if (candidates.length === 0) {
    box.innerHTML = '<span style="font-size:12px;color:var(--text-muted);">結びつけられる過去の記録がまだありません。</span>';
  } else {
    candidates.forEach(cand => {
      const lbl = document.createElement('label');
      lbl.className = 'link-option';
      const checked = currentLinks.has(cand.id) ? 'checked' : '';
      lbl.innerHTML = `
        <input type="checkbox" value="${cand.id}" ${checked}>
        <span>[${getTypeLabel(cand)}] ${escapeHtml(cand.title)}</span>
      `;
      box.appendChild(lbl);
    });
  }

  document.getElementById('editModal').classList.add('open');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('open');
}

function saveItem() {
  const sc = getCurrentScenario();
  const type = document.getElementById('editType').value;
  const id = document.getElementById('editId').value;
  const day = document.getElementById('fieldDay').value;
  const title = document.getElementById('fieldTitle').value.trim();
  const summary = document.getElementById('fieldSummary').value.trim();
  const raw = document.getElementById('fieldRaw').value;
  const subTag = document.getElementById('fieldSubTag').value;

  if (!title) {
    alert('タイトルまたは名前を入力してください。');
    return;
  }

  const selectedLinks = [...document.querySelectorAll('#linkSelectorBox input:checked')].map(cb => cb.value);

  if (id) {
    const item = sc.items.find(x => x.id === id);
    if (item) {
      item.day = day;
      item.title = title;
      item.summary = summary;
      item.raw = raw;
      if (type === 'secret' || type === 'loc') item.subTag = subTag;
      item.links = selectedLinks;
      sc.items.forEach(other => {
        if (other.id !== id && other.links && !selectedLinks.includes(other.id)) {
          other.links = other.links.filter(l => l !== id);
        }
      });
    }
  } else {
    const existingNums = sc.items.filter(x => x.type === type).map(x => x.num || 0);
    const nextNum = existingNums.length > 0 ? Math.max(...existingNums) + 1 : 1;
    const newItem = {
      id: type + '_' + Date.now(),
      type,
      num: nextNum,
      day,
      subTag: (type === 'secret' || type === 'loc') ? subTag : '',
      title,
      summary,
      raw,
      links: selectedLinks
    };
    sc.items.push(newItem);
  }

  saveState();
  closeModal();
  renderAll();
}

function deleteItem(id) {
  if (!confirm('この記録を削除しますか？')) return;
  const sc = getCurrentScenario();
  sc.items = sc.items.filter(x => x.id !== id);
  sc.items.forEach(x => {
    if (x.links) x.links = x.links.filter(l => l !== id);
  });
  saveState();
  renderAll();
}

// Export / Import
function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `trpg_notes_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (parsed && parsed.scenarios) {
        state = parsed;
        saveState();
        renderAll();
        alert('データを復元しました！');
      } else {
        alert('無効なJSONファイルです。');
      }
    } catch (err) {
      alert('ファイルの読み込みに失敗しました。');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function exportMarkdown() {
  const sc = getCurrentScenario();
  let md = `# ${sc.name}\n\n`;
  md += `## 📌 現在の目的・TODO\n`;
  sc.todos.forEach(t => {
    md += `- [${t.done ? 'x' : ' '}] ${t.text}\n`;
  });
  md += `\n`;

  if (sc.freeMemo && sc.freeMemo.trim()) {
    md += `## ✏️ 自由メモ・雑記\n${sc.freeMemo.trim()}\n\n`;
  }

  const sections = [
    { type: 'secret', title: '🔒 秘匿HO・裏情報' },
    { type: 'info', title: '📄 入手情報' },
    { type: 'npc', title: '👤 NPCリスト' },
    { type: 'loc', title: '🗺️ 場所・ギミック' },
    { type: 'hyp', title: '🧠 考察・仮説' }
  ];

  sections.forEach(sec => {
    const list = sc.items.filter(x => x.type === sec.type);
    if (list.length === 0) return;
    md += `## ${sec.title}\n\n`;
    list.forEach(it => {
      md += `### [${getTypeLabel(it)}] ${it.title}（${it.day}${it.subTag ? ' / ' + it.subTag : ''}）\n`;
      md += `${it.summary}\n`;
      if (it.raw && it.raw.trim()) {
        md += `\n> **原文ログ:**\n> ${it.raw.replace(/\n/g, '\n> ')}\n`;
      }
      md += `\n`;
    });
  });

  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${sc.name}_まとめ.md`;
  a.click();
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function renderAll() {
  renderScenarioSelect();
  updateDayFilterOptions();
  renderTodos();
  renderFreeMemo();
  renderHypotheses();
  renderMain();
}

loadState();
renderAll();
</script>
